name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      LAYA_MLX_TEST_DEVICE: cpu
      TOKENIZERS_PARALLELISM: "false"
      USE_TF: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NandhaKishorM/laya
          ref: 573e5b62696ba441230cd6be71d593331b5d23af
          path: .upstream
      - uses: actions/checkout@v4
        with:
          repository: NandhaKishorM/laya
          ref: 1adc59f7e371deb601fcfa18a14e25db238addcc
          path: .cache/upstream-v0.4.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,reference,demo]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Diagnose native CPU failures
        if: failure()
        run: python -u -m scripts.diagnose_parallel_cpu
      - name: Show native crash reports
        if: failure()
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          folder = Path.home() / "Library/Logs/DiagnosticReports"
          for path in sorted(folder.glob("*Python*"))[-2:]:
              print(path.name)
              print(path.read_text()[:40000])
          PYCODE
      - run: python -m build
